name: wasm

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  wasm32-unknown-unknown:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable) with the wasm32 target
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: cargo check (wasm32-unknown-unknown)
        run: cargo check --lib --target wasm32-unknown-unknown

      # A pinned release binary checked against its SHA-256, not an install
      # script. wasm-pack fetches the wasm-bindgen test runner that matches
      # Cargo.lock.
      - name: Install wasm-pack
        env:
          WASM_PACK_VERSION: '0.13.1'
          WASM_PACK_SHA256: 'c539d91ccab2591a7e975bcf82c82e1911b03335c80aa83d67ad25ed2ad06539'
        run: |
          set -euo pipefail
          name="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o wasm-pack.tar.gz \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${name}.tar.gz"
          echo "${WASM_PACK_SHA256}  wasm-pack.tar.gz" | sha256sum -c -
          tar -xzf wasm-pack.tar.gz "${name}/wasm-pack"
          install -D -m 0755 "${name}/wasm-pack" "$HOME/.cargo/bin/wasm-pack"

      - name: cargo test (wasm32-unknown-unknown, under Node)
        run: wasm-pack test --node --release . --test wasm
